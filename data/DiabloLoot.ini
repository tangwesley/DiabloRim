# Diablo In Skyrim -- settings
#
# Every setting here is optional and has a safe default; deleting this file is
# the same as accepting all of them. Values may be 1/0, true/false, yes/no, on/off.

[General]

# Roll affixes onto NPC gear and container loot. Turning this off stops all new
# rolls -- items already affixed keep what they have.
Distribution=1

# Roll affixes onto items a QUEST hands you, on the way into your inventory.
# Needs Distribution=1 as well; turning that off turns this off with it.
#
# Only items that could also have come out of a leveled list are touched -- the
# generic Elven Sword a jarl pays you with, not Dawnbreaker. Artifacts and
# one-of-a-kind gear appear in no leveled list, which is how they are told apart,
# so this needs no patch when you add a mod that introduces either kind.
#
# Also left alone: anything a quest still has an alias on (it wants that exact
# item back), items handed over more than one at a time, and the output of a
# forge -- crafting reaches your inventory by the same route a reward does, and
# turning smithing into an affix slot machine is a different decision from this
# one.
#
# The roll lands about a second after the item reaches your pack, not on the
# same instant, and the pause is deliberate: the game is still finishing the
# hand-over at the moment it announces it. The wait also holds while a dialogue,
# barter, container, crafting or inventory menu is open, so a roll never lands
# in the middle of one.
#
# The reward announces itself once, with the name it ended up with rather than
# the one it arrived as.
QuestRewards=1

# How much loot a chest gives, as a multiplier. 1 is vanilla; 3 means a chest
# is filled three times over.
#
# This does NOT invent a new loot table. Every container in Skyrim is built from
# leveled lists -- "one weapon appropriate to this dungeon", "some gold" -- and
# the game resolves each of them once, the first time you open the chest. This
# setting resolves them again, at the same level, so a 3 gives you what three
# chests in that room would have held. Balance stays the game's own.
#
# What is NOT multiplied: anything placed in a container by hand. The quest note,
# the key, the named sword somebody put in that specific chest -- those are
# decisions about that container, not random loot, and duplicating them ranges
# from silly to save-breaking. Only the random part is rolled again.
#
# Fractions work and are the honest way to say "a bit more". 1.5 is a second
# helping half the time, not half an item.
#
# The bonus items are added BEFORE affixes are rolled, so they are ordinary loot
# in every sense -- they can come out blue, or orange, or plain.
#
# Two things to know before you turn this up:
#
#   * A chest is stocked ONCE per filling: the first time you open it, and then
#     again each time the game respawns it. Skyrim resets a dungeon on its
#     encounter zone's timer -- ten in-game days for most, thirty once you have
#     cleared it -- and a chest that has been refilled is treated as the new
#     chest it now is, contents rolled fresh. Rerunning a dungeon pays out
#     again, which is the point of rerunning it.
#
#     What this does NOT do is re-roll a chest you already emptied but the game
#     has not reset. Turning the multiplier up affects chests you have not
#     opened yet and chests that respawn from here on, not the ones behind you.
#     Turning it DOWN never removes anything already given.
#   * There is a hard ceiling of 64 bonus items per container, so a stray 10 on
#     a merchant chest cannot stall the menu. Hitting it is written to the log.
#
# Values below 1 are clamped away: taking loot back out means choosing what to
# delete, which is a different feature than this one.
ContainerLootMultiplier=3

# The character trailing a rolled item's name, repeated once per rarity band:
# one for blue, two for yellow, three for purple, four for orange, five for red.
# Plain white items never get one.
#
# Red is the top band: an item carrying all five affixes at high enough tiers,
# and only found at item level 35 and above.
#
#     Nulling Iron Sword of Draining ◆◆
#
# Whatever you put here is used verbatim -- a diamond, a star, an asterisk, even
# a word. Two things worth knowing before you pick:
#
#   * SAVE THIS FILE AS UTF-8 if you use a non-ASCII character. Notepad's
#     "ANSI" will write a byte the game then draws as garbage.
#   * Not every menu can draw every glyph. Grid Inventory handles the symbol
#     range these live in, but vanilla's barter and container screens are
#     fussier -- if you see boxes there, switch to something ASCII like * or +.
#
# Leave the line out entirely for the default (◆). Set it to NOTHING --
# just "TierMarker=" with an empty value -- to turn the marker off completely.
#
#TierMarker=◆
TierMarker=★
#TierMarker=*
#TierMarker=

# Whether the marker goes into the item's NAME.
#
# Leave this line commented out and the mod decides for you: with Grid
# Inventory (the DiabloRim build) installed the marker stays OUT of the name and
# the colour does the talking; without it the marker goes INTO the name, since
# the vanilla inventory has nowhere else to show it. Set 1 or 0 to force it.
#
# IF YOU USE GRID INVENTORY, CONSIDER TURNING THIS OFF. The grid already colours
# each item by its band -- blue, yellow, purple, orange, red -- so the glyphs repeat
# something you can already see, and a name is an expensive place to repeat it:
# the marker becomes part of how your inventory sorts, part of what a narrow
# barter column cuts off, and it is written into your save for every affixed
# item you own. With TierMarkerInName=0 the names stay exactly as Skyrim would
# write them and the colour does the talking.
#
# Drawing the marker only when you HIGHLIGHT an item, instead of in the name,
# was tried in an earlier build and removed -- it crashed on opening a forge.
# Getting it back needs work that has not been done yet.
#
# Either way this only affects items rolled from here on. Gear already lying in
# a chest keeps the name it was given.
#TierMarkerInName=0


[Tools]

# ONE-OFF. Writes SKSE/DiabloLoot_discovered.csv: every enchantment effect from
# a third-party plugin in your load order, laid out as affix rows ready to trim.
#
# Run this once after installing something like Summermyst, edit the file down to
# the affixes you want, save it beside the DLL as
#
#     SKSE/Plugins/DiabloLoot_affixes_<name>.csv
#
# and then turn this back off. Anything matching DiabloLoot_affixes_*.csv merges
# after the base table, so your add-on survives every update to the base data.
Discovery=0

# Prints the full magic-effect ground-truth listing at every launch -- what each
# (archetype, actor value) group in your load order is actually built from.
# Useful while authoring an affix table, noise once it is settled.
VerboseSurvey=0
